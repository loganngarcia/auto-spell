<!doctype html>
<html>
<head>
<title>Pop-Up Menu</title>
<link rel="stylesheet" href="css/popup.css" type="text/css">
<script type="text/javascript" src="js/jquery-2.0.2.min.js"></script>
<script type="text/javascript" src="js/options.js"></script>
<script type="text/javascript" src="js/popup.js"></script>
</head>
<body tabindex="1" style="overflow: hidden;">
<header>
  <div class="heading"><img src="../images/icon-38x38.png"/><label>Spell Bee</label></div>
</header>
<div class="page-container">
<div class="app-disabled hide"><span class="icon-close"></span>Extension is <span class="disabled">Disabled</span></div>
<div class="site-status"><span class="icon-checkmark on"></span><span class="enabled on">Enabled</span><span class="icon-close off hide"></span><span class="disabled off hide">Disabled</span> on this site</div>
</div>
<div class="loader hide"><img src="images/progress_bar.gif"/></div>
<div class="notification hide">Please refresh the page</div>
<div id="options" role="button">
  <span class="icon-cog"></span>
  <span class="settings">Options</span>
</div>
<footer class="share-box">
<div class="notification">Spread the love maybe ?</div>
<div class="buttons">
<a class="share-facebook" title="Facebook"><span class="icon-facebook2"></span></a>
<a class="share-twitter" title="Twitter"><span class="icon-twitter2"></span></a>
<a class="share-google" title="Google"><span class="icon-googleplus2"></span></a>
</div>
</footer>

<script type="text/javascript" src="js/analytics.js"></script>
</body>
</html>
